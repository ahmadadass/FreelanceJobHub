<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title description">
  <title id="title">FreelanceJobHub database schema</title>
  <desc id="description">Users has a one-to-many relationship with projects through projects.user_id.</desc>
  <rect width="1100" height="690" fill="#f4f7fb"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#163b65">FreelanceJobHub - SQLite Schema</text>

  <rect x="60" y="105" width="390" height="510" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <rect x="60" y="105" width="390" height="62" rx="18" fill="#163b65"/>
  <rect x="60" y="145" width="390" height="22" fill="#163b65"/>
  <text x="85" y="146" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">users</text>

  <g font-family="Arial, sans-serif" font-size="18" fill="#102a43">
    <text x="85" y="207" font-weight="700">PK</text><text x="130" y="207">id</text><text x="280" y="207" fill="#64748b">INTEGER</text>
    <line x1="80" y1="225" x2="430" y2="225" stroke="#d7e0ea"/>
    <text x="130" y="257">name</text><text x="280" y="257" fill="#64748b">TEXT NOT NULL</text>
    <text x="130" y="307">email</text><text x="280" y="307" fill="#64748b">TEXT UNIQUE</text>
    <text x="130" y="357">username</text><text x="280" y="357" fill="#64748b">TEXT UNIQUE</text>
    <text x="130" y="407">password</text><text x="280" y="407" fill="#64748b">TEXT NOT NULL</text>
    <text x="130" y="457">phone</text><text x="280" y="457" fill="#64748b">TEXT</text>
    <text x="130" y="507">birthdate</text><text x="280" y="507" fill="#64748b">TEXT</text>
    <text x="130" y="557">profile_image</text><text x="280" y="557" fill="#64748b">TEXT</text>
  </g>

  <rect x="650" y="85" width="390" height="550" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <rect x="650" y="85" width="390" height="62" rx="18" fill="#163b65"/>
  <rect x="650" y="125" width="390" height="22" fill="#163b65"/>
  <text x="675" y="126" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">projects</text>

  <g font-family="Arial, sans-serif" font-size="18" fill="#102a43">
    <text x="675" y="187" font-weight="700">PK</text><text x="720" y="187">id</text><text x="870" y="187" fill="#64748b">INTEGER</text>
    <text x="675" y="237" font-weight="700">FK</text><text x="720" y="237">user_id</text><text x="870" y="237" fill="#64748b">INTEGER</text>
    <line x1="670" y1="255" x2="1020" y2="255" stroke="#d7e0ea"/>
    <text x="720" y="287">title</text><text x="870" y="287" fill="#64748b">TEXT NOT NULL</text>
    <text x="720" y="337">client_name</text><text x="870" y="337" fill="#64748b">TEXT NOT NULL</text>
    <text x="720" y="387">client_phone</text><text x="870" y="387" fill="#64748b">TEXT</text>
    <text x="720" y="437">meeting_address</text><text x="870" y="437" fill="#64748b">TEXT</text>
    <text x="720" y="487">budget</text><text x="870" y="487" fill="#64748b">REAL</text>
    <text x="720" y="537">status</text><text x="870" y="537" fill="#64748b">TEXT NOT NULL</text>
    <text x="720" y="587">due_date</text><text x="870" y="587" fill="#64748b">TEXT</text>
    <text x="720" y="617">description</text><text x="870" y="617" fill="#64748b">TEXT</text>
  </g>

  <path d="M450 237 C520 237, 570 237, 650 237" fill="none" stroke="#0d9488" stroke-width="4"/>
  <circle cx="465" cy="237" r="8" fill="#0d9488"/>
  <path d="M625 222 L650 237 L625 252" fill="none" stroke="#0d9488" stroke-width="4"/>
  <text x="550" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">1 : MANY</text>
  <text x="550" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">ON DELETE CASCADE</text>
</svg>
